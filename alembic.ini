[alembic]
script_location = migrations
prepend_sys_path = .
# `app` is importable because the project is installed with `pip install -e .`
# The URL is supplied by migrations/env.py from the environment, so a
# connection string is never committed to the repo.
sqlalchemy.url =

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
