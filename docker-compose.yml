services:
  db:
    # pgvector image now so week 3 doesn't need a swap; the extension stays unused until then.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recur
      POSTGRES_PASSWORD: recur
      POSTGRES_DB: recur
    ports:
      # 127.0.0.1 is load-bearing, not decoration. Plain "5433:5432" binds
      # 0.0.0.0, which puts a database full of your bank transactions on every
      # network you join, behind a password that is in this file. 5433 so it
      # can't collide with a local postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      # No initdb mount. schema.sql moved into the package, and the path here
      # went stale silently -- Docker mounts a missing file as a *directory*,
      # so the container failed to start rather than saying the file was gone.
      # Nothing needed it: tests call db.apply_schema(), production runs Alembic.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recur"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
