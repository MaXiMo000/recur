# Render blueprint. One web service + one managed Postgres, nothing public
# except the web service itself.
#
# Deliberately absent: a static site. The React build is served by the API from
# the same origin, because a separate frontend origin would force
# SameSite=None cookies and give up the CSRF protection SameSite provides.

databases:
  - name: recur-db
    databaseName: recur
    user: recur
    plan: basic-256mb
    # No `ipAllowList` entries at all means the database accepts connections
    # only from inside Render's private network -- not from the internet.
    ipAllowList: []

services:
  - type: web
    name: recur
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: false          # deploy on purpose, not on every push
    envVars:
      - key: RECUR_ENV
        value: production      # makes config.check() fatal on a missing secret

      - key: DATABASE_URL      # owner role: migrations only
        fromDatabase:
          name: recur-db
          property: connectionString

      # The unprivileged role the app actually connects as. Generated by
      # Render and never seen by anyone, including whoever deploys this.
      - key: RECUR_APP_PASSWORD
        generateValue: true

      # RECUR_PUBLIC_URL and RECUR_ALLOWED_ORIGINS are deliberately absent.
      # `fromService: property: host` looks like the right answer and is not:
      # it resolves to the *private* network hostname with no scheme, so
      # verification links would render as "recur/verify?token=..." -- broken,
      # and passing every validation the app had. Render sets
      # RENDER_EXTERNAL_URL (https://recur.onrender.com) on the service itself;
      # config.py reads that and now refuses to boot on anything scheme-less.
      # Set RECUR_PUBLIC_URL in the dashboard only for a custom domain.

      - key: RECUR_COOKIE_SAMESITE
        value: lax             # safe because the app is same-origin

      - key: RECUR_POOL_MAX
        value: "8"

      # Closed until a sending domain is verified. From the shared sandbox
      # sender (onboarding@resend.dev) Resend delivers only to the address that
      # owns the account and returns 200 for everyone else -- so open signup
      # would hand every other user a "check your email" screen, no email, and
      # no error anywhere explaining it. Flip to "1" the day a domain verifies.
      #
      # Bootstrapping your own account: this gate blocks /api/auth/register for
      # everyone, and there is no admin path around it. So on the first deploy,
      # set this to "1" in the Render *dashboard* (a dashboard edit outlives
      # deploys and is reverted only by an explicit Blueprint sync), register,
      # verify, then set it back to "0". The safe value is what lives in git.
      - key: RECUR_REGISTRATION_OPEN
        value: "0"

      # Optional. Leave unset and no error tracking is initialised at all.
      - key: SENTRY_DSN
        sync: false

      # Set this in the Render dashboard, not here. Without it the service
      # refuses to start rather than writing verification links to the log.
      - key: RESEND_API_KEY
        sync: false
      - key: RECUR_EMAIL_FROM
        sync: false
