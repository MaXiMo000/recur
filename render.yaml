# Render blueprint. One web service + one managed Postgres, nothing public
# except the web service itself.
#
# Deliberately absent: a static site. The React build is served by the API from
# the same origin, because a separate frontend origin would force
# SameSite=None cookies and give up the CSRF protection SameSite provides.

databases:
  - name: recur-db
    databaseName: recur
    user: recur
    plan: basic-256mb
    # No `ipAllowList` entries at all means the database accepts connections
    # only from inside Render's private network -- not from the internet.
    ipAllowList: []

services:
  - type: web
    name: recur
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: false          # deploy on purpose, not on every push
    envVars:
      - key: RECUR_ENV
        value: production      # makes config.check() fatal on a missing secret

      - key: DATABASE_URL      # owner role: migrations only
        fromDatabase:
          name: recur-db
          property: connectionString

      # The unprivileged role the app actually connects as. Generated by
      # Render and never seen by anyone, including whoever deploys this.
      - key: RECUR_APP_PASSWORD
        generateValue: true

      - key: RECUR_PUBLIC_URL
        fromService:
          type: web
          name: recur
          property: host

      - key: RECUR_ALLOWED_ORIGINS
        fromService:
          type: web
          name: recur
          property: host

      - key: RECUR_COOKIE_SAMESITE
        value: lax             # safe because the app is same-origin

      - key: RECUR_POOL_MAX
        value: "8"

      - key: RECUR_REGISTRATION_OPEN
        value: "1"

      # Set this in the Render dashboard, not here. Without it the service
      # refuses to start rather than writing verification links to the log.
      - key: RESEND_API_KEY
        sync: false
      - key: RECUR_EMAIL_FROM
        sync: false
