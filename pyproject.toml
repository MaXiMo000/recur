[project]
name = "recur"
version = "1.0.0"
description = "Recurring-charge truth engine. Bank CSV in, subscriptions out."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[build-system]
# 77 is the floor for PEP 639 (`license = "MIT"` as an SPDX expression).
# On 68 a clean build environment would reject it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `pip install -e .` puts `app` on the path, so tests and scripts import the
# same way the deployed process does. No sys.path juggling in any file.
packages = ["app", "app.core"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
